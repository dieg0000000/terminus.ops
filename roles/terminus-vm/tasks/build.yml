- name: Clone the fsd-terminus repository
  ansible.builtin.git:
    repo: https://github.com/epfl-si/fsd-terminus.git
    dest: /root/fsd-terminus
    version: main

- name: Copy the main .env file from Keybase
  ansible.builtin.copy:
    content: "{{ lookup('pipe', 'keybase fs read /keybase/team/epfl_sopec/terminus/env') }}\n"
    dest: /root/fsd-terminus/.env
    mode: "0600"
  diff: false
  no_log: true

- name: Copy the ews-api .env file from Keybase
  ansible.builtin.copy:
    content: "{{ lookup('pipe', 'keybase fs read /keybase/team/epfl_sopec/terminus/ews-api.env') }}\n"
    dest: /root/fsd-terminus/ews-api/.env
    mode: "0600"
  diff: false
  no_log: true