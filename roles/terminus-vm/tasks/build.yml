- name: Clone the fsd-terminus repository
  ansible.builtin.git:
    repo: https://github.com/epfl-si/fsd-terminus.git
    dest: /root/fsd-terminus
    version: main

- name: Copy the main .env file
  ansible.builtin.copy:
    src: .env
    dest: /root/fsd-terminus/.env
    mode: "0600"
  diff: false

- name: Copy the ews-api .env file
  ansible.builtin.copy:
    src: ews-api.env
    dest: /root/fsd-terminus/ews-api/.env
    mode: "0600"
  diff: false