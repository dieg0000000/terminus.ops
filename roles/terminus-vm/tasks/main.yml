- name: Setup
  include_tasks:
    file: setup.yml
    apply:
      tags:
        - setup
  tags: always

- name: Build
  include_tasks:
    file: build.yml
    apply:
      tags:
        - build
  tags: always

- name: Run
  include_tasks:
    file: run.yml
    apply:
      tags:
        - run
  tags: always

- name: Migrate
  include_tasks:
    file: migrate.yml
    apply:
      tags:
        - migrate
        - never
  tags: always